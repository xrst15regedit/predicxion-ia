name: PredicXion IA - Actualización Automática 22:00 PE

on:
  schedule:
    # 03:00 UTC = 22:00 America/Lima (UTC-5) todos los días
    - cron: "0 3 * * *"
    # Respaldo cada 4 horas para liquidar resultados de partidos terminados y mantener calendario sincronizado
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar ejecución aunque ya se haya publicado hoy"
        required: false
        default: "false"

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar servidor Render y verificar salud
        run: |
          curl -fsS --retry 3 --retry-delay 10 "${{ secrets.PREDICXION_BASE_URL }}/api/v1/health"

      - name: Ejecutar pipeline diario de 10 pasos (America/Lima)
        run: |
          FORCE_FLAG="${{ github.event.inputs.force || 'false' }}"
          curl -fsS -X POST "${{ secrets.PREDICXION_BASE_URL }}/api/v1/cron/daily-sync" \
            -H "X-Cron-Token: ${{ secrets.CRON_SECRET_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"force\": ${FORCE_FLAG}, \"motivo\": \"GITHUB_ACTIONS_CRON_PE\"}"
