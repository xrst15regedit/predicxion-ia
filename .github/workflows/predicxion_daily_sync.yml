name: PredicXion IA - sincronización automática

on:
  schedule:
    # 03:00 UTC = 22:00 del día anterior en America/Lima (UTC-5).
    - cron: "0 3 * * *"
    # Revisión periódica de resultados y calendario.
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar la ejecución aunque ya exista una publicación"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: predicxion-daily-sync
  cancel-in-progress: false

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Despertar Render y comprobar salud
        env:
          BASE_URL: ${{ secrets.PREDICXION_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          curl --fail-with-body --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            "$BASE_URL/api/v1/health"

      - name: Ejecutar pipeline diario
        env:
          BASE_URL: ${{ secrets.PREDICXION_BASE_URL }}
          CRON_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
          FORCE_FLAG: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL"
          test -n "$CRON_TOKEN"

          if [ "$FORCE_FLAG" = "true" ]; then
            BODY='{"force":true,"motivo":"GITHUB_ACTIONS_MANUAL_PE"}'
          else
            BODY='{"force":false,"motivo":"GITHUB_ACTIONS_CRON_PE"}'
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 10 --retry-all-errors \
            -X POST "$BASE_URL/api/v1/cron/daily-sync" \
            -H "X-Cron-Token: $CRON_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY"
