services:
  - type: web
    name: predicxion-ia
    env: python
    buildCommand: pip install -r requirements.txt
    # Un solo worker con 4 hilos garantiza estado consistente de Top3RotationManager,
    # caché del carrusel, índice de fechas y data_version en memoria.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: TZ
        value: "America/Lima"
      - key: DISABLED_COMPETITIONS
        value: "UNL"
      - key: ALLOW_SIMULATED_ACTA
        value: "false"
      - key: CRON_SECRET_TOKEN
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
      - key: HIGHLIGHTLY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
# Programación diaria 22:00 America/Lima gestionada exclusivamente por
# .github/workflows/predicxion_daily_sync.yml contra POST /api/v1/cron/daily-sync
# (evita ejecuciones duplicadas simultáneas con Render Cron).
