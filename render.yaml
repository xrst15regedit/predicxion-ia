services:
  - type: web
    name: predicxion-ia
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --worker-class gthread --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /api/v1/health
    envVars:
      # Vacío mantiene activas todas las competiciones configuradas.
      # Para desactivar temporalmente Nations League usa: UNL
      - key: DISABLED_COMPETITIONS
        value: ""
      - key: ALLOW_SIMULATED_ACTA
        value: "false"
      - key: CRON_SECRET_TOKEN
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
      - key: HIGHLIGHTLY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
