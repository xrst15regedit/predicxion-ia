services:
  - type: web
    name: predicxion-ia
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: DISABLED_COMPETITIONS
        value: ""
      - key: ALLOW_SIMULATED_ACTA
        value: "false"
      - key: CRON_SECRET_TOKEN
        sync: false
      - key: FOOTBALL_API_KEY
        sync: false
      - key: HIGHLIGHTLY_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false

  # Cron Job diario en Render a las 22:00 America/Lima (03:00 UTC del día siguiente)
  - type: cron
    name: predicxion-ia-daily-22h-lima
    env: python
    schedule: "0 3 * * *"
    buildCommand: "echo 'Cron job ready'"
    startCommand: >-
      curl -fsS -X POST https://predicxion-ia.onrender.com/api/v1/cron/daily-sync
      -H "X-Cron-Token: ${CRON_SECRET_TOKEN}"
      -H "Content-Type: application/json"
      -d '{"motivo":"RENDER_CRON_22_00_PE"}'
    envVars:
      - key: CRON_SECRET_TOKEN
        sync: false
